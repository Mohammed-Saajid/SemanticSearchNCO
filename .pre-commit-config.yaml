repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff check
        entry: bash -c 'cd backend && uv run ruff check app tests benchmark --fix'
        language: system
        pass_filenames: false
        always_run: true

      - id: ruff-format
        name: Ruff format check
        entry: bash -c 'cd backend && uv run ruff format app tests benchmark'
        language: system
        pass_filenames: false
        always_run: true

      - id: bandit
        name: Bandit security scan
        entry: bash -c 'cd backend && uv run bandit --recursive app'
        language: system
        pass_filenames: false
        always_run: true

      - id: mypy
        name: Mypy type check
        entry: bash -c 'cd backend && uv run mypy app'
        language: system
        pass_filenames: false
        always_run: true
